<!-- start custom head snippets -->
<!-- Canonical, Open Graph, and Twitter Card tags are emitted exactly once by
     the local _includes/seo.html override (do NOT re-add them here — that
     caused every page to ship two conflicting sets of social meta tags). -->

<!-- Custom CSS -->
<link rel="stylesheet" href="/assets/css/custom.css">

<!-- Favicon -->
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">

<!-- Structured Data (JSON-LD) -->
{% include structured-data.html %}

<!-- Nav: underline the current page (masthead is include_cached, so this
     can't be done in Liquid — page.url is stale inside the cached include) -->
<script>
document.addEventListener('DOMContentLoaded', function () {
  document.querySelectorAll('.masthead .visible-links a[href]').forEach(function (a) {
    if (a.getAttribute('href') === location.pathname) a.classList.add('nav-current');
  });
});
</script>

<!-- end custom head snippets -->
